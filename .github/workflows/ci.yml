name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Coverage floor. This is a tiny pure-Go null-object primitive with no
  # arch-specific code, so the same figure holds on every target arch.
  COVER_MIN: "100.0"

jobs:
  # ---- Native runners --------------------------------------------------
  native:
    name: native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: test (coverage)
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -cover ./... | tee cover.txt
          pct=$(grep -oE 'coverage: [0-9.]+%' cover.txt | grep -oE '[0-9.]+' | head -1)
          echo "coverage on ${{ matrix.arch }}: ${pct}% (floor ${COVER_MIN}%)"
          awk -v p="$pct" -v m="$COVER_MIN" 'BEGIN { exit !(p+0 >= m+0) }' \
            || { echo "coverage ${pct}% < ${COVER_MIN}%"; exit 1; }

  # ---- Emulated targets (QEMU via binfmt) ------------------------------
  # macOS and Windows.
  #
  # A fleet audit of the 601 repositories holding Go code found the OS axis to
  # be the real gap, not the architecture axis: windows is absent from 54.4% of
  # them and macOS from 48.6%, while each of riscv64, loong64, ppc64le and
  # s390x is missing from only ~31.4%. This repository is pure computation, so
  # there is no platform reason for the gap -- which is why the audit listed it
  # as actionable rather than constrained.
  #
  # It is a job of its own rather than two more entries in the matrix above,
  # because that matrix is about ARCHITECTURE and because its steps use POSIX
  # shell (`set -euo pipefail`, `CGO_ENABLED=0 go build`) that the Windows
  # runner's PowerShell reads as a command it cannot find. CGO_ENABLED moves to
  # env and the scripted step asks for bash by name.
  os-matrix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go build ./...
      - name: Test with coverage
        shell: bash
        run: |
          set -euo pipefail
          # Same per-package gate as `native`: the demo `main` package has no
          # tests and no statements to exercise, and is excluded there too.
          for pkg in $(go list ./...); do
            if ! ls "$(go list -f '{{.Dir}}' "$pkg")"/*_test.go >/dev/null 2>&1; then
              echo "${pkg}: no tests — skipping"
              continue
            fi
            go test -cover -coverprofile=cover.out "$pkg"
            total=$(go tool cover -func=cover.out \
              | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
            echo "${pkg} coverage: ${total}%"
            awk -v t="$total" -v m="$COVERAGE_MIN" \
              'BEGIN { exit (t+0 >= m+0) ? 0 : 1 }' \
              || { echo "coverage ${total}% < ${COVERAGE_MIN}%"; exit 1; }
          done


  emulated:
    name: emulated ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: "rv64,v=true,vlen=128"
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: power9
          - arch: s390x
            image: debian:trixie
            qemu_cpu: qemu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: register QEMU binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      - name: cross-compile per-package test binaries
        run: |
          set -euo pipefail
          mkdir -p _tbin
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/.' '__')
            GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
              go test -c -cover -o "_tbin/${name}.test" "$pkg"
          done
          ls -l _tbin

      - name: run test binaries under QEMU (${{ matrix.arch }})
        run: |
          set -euo pipefail
          fail=0
          for bin in _tbin/*.test; do
            [ -e "$bin" ] || continue
            echo "::group::$bin"
            out=$(docker run --rm --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU='${{ matrix.qemu_cpu }}' \
              -v "$PWD/_tbin:/tbin:ro" \
              ${{ matrix.image }} "/tbin/$(basename "$bin")" -test.v 2>&1) || fail=1
            echo "$out"
            pct=$(echo "$out" | grep -oE 'coverage: [0-9.]+%' | grep -oE '[0-9.]+' | head -1)
            if [ -n "${pct:-}" ]; then
              echo "coverage on ${{ matrix.arch }} ($bin): ${pct}% (floor ${COVER_MIN}%)"
              awk -v p="$pct" -v m="$COVER_MIN" 'BEGIN { exit !(p+0 >= m+0) }' \
                || { echo "coverage ${pct}% < ${COVER_MIN}%"; fail=1; }
            fi
            echo "::endgroup::"
          done
          exit $fail
